services:
  flux-dl:
    build: .
    container_name: flux-dl
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - /DATA/Downloads/flux-dl:/downloads
    environment:
      - PORT=8484
      - DOWNLOADS_DIR=/downloads
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8484/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      casaos.name: "Flux"
      casaos.title.en_us: "Flux"
      casaos.title.pt_br: "Flux"
      casaos.category: "Downloader"
      casaos.description: "Download videos and audio from YouTube, Instagram, TikTok and 1000+ sites directly on your server."
      casaos.icon: "https://raw.githubusercontent.com/AnthonyPerotti/flux-dl/main/docs/icon.png"
      casaos.port_map: "8484"
      casaos.index: "/"
      casaos.hostname: ""
      casaos.store_app_id: "flux-dl"
