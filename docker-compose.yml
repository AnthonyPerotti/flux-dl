services:
  flux-dl:
    build: .
    container_name: flux-dl
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - /DATA/Downloads/flux-dl:/downloads
    environment:
      - PORT=8484
      - DOWNLOADS_DIR=/downloads
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8484/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
